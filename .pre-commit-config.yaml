# Install both stages: pre-commit install --hook-type pre-commit --hook-type pre-push
# Commit hygiene: pre-commit run --all-files
# Optional full preflight: pre-commit run --hook-stage pre-push --all-files
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      # 1 MiB (default 500 KB): #198's DPR-3 visual baselines
      # (tests/visual/baselines/gold-journey/desktop-dpr3-*.png, up to
      # ~790 KB) are committed as-is -- recompressing them would break the
      # harness's byte-identical baseline comparison against fresh captures.
      - id: check-added-large-files
        args: ['--maxkb=1024']
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        description: Format Rust code
        entry: cargo fmt --all -- --check
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      # One authoritative full gate, including config-only / non-Rust pushes.
      - id: cargo-pre-push
        name: cargo xtask pre-push (full gate)
        description: Workspace default/review lint and tests plus build matrix
        entry: cargo xtask pre-push
        language: system
        verbose: true
        pass_filenames: false
        always_run: true
        stages: [pre-push]
